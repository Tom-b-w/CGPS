protocol: cgps_main_table
seed: 42
backbone: ViT-B/16
batch_size: 1
datasets:
  - fgvc
  - caltech101
  - stanford_cars
  - dtd
  - eurosat
  - oxford_flowers
  - food101
  - oxford_pets
  - sun397
  - ucf101
cgps:
