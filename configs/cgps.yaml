  trigger_fraction: 0.25
  selection_fraction: 0.10
  min_consensus_count: 5
metrics:
  - top1_accuracy
result_keys:
  dota_baseline: dota_official
  dota_cgps: refine_hc
  tda_baseline: tda_baseline
  tda_cgps: tda_refine_hc
