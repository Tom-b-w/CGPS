[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgps"
version = "1.0.0"
description = "Reproducible research code for Consensus-Guided Prompt Selection"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "torch>=1.12,<3",
  "torchvision>=0.13,<1",
  "tqdm>=4.66,<5",
  "yacs==0.1.8",
  "ftfy>=6.2,<7",
  "regex>=2024.7.24",
  "wilds==1.2.2",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["third_party", "scripts/camera_ready_runner.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
